<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="240" height="360">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121A27"/><stop offset="1" stop-color="#05080E"/></linearGradient>
<radialGradient id="gl" cx="50%" cy="38%" r="60%"><stop offset="0" stop-color="#A4ED07" stop-opacity=".28"/><stop offset="1" stop-color="#A4ED07" stop-opacity="0"/></radialGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<style>text{font-family:'Geist Mono',ui-monospace,Menlo,monospace} .lb{font-size:7px;letter-spacing:.9px;fill:#E8ECF1;font-weight:600} .sb{font-size:5.2px;letter-spacing:.6px;fill:#8E97A4}</style>
<rect x=".5" y=".5" width="119" height="179" rx="12" fill="url(#bg)" stroke="#A4ED07" stroke-opacity=".45"/>
<rect x=".5" y=".5" width="119" height="179" rx="12" fill="url(#gl)"/>
<g transform="translate(60 74)">
<circle r="34" fill="none" stroke="#26303D" stroke-width="3"/>
<circle r="34" fill="none" stroke="#A4ED07" stroke-width="3" stroke-linecap="round" stroke-dasharray="40 174" transform="rotate(-90)">
<animateTransform attributeName="transform" type="rotate" from="-90" to="270" dur="3.2s" repeatCount="indefinite"/></circle>
<g font-size="5.4" fill="#C5CCD6" text-anchor="middle" style="font-family:'Geist Mono',ui-monospace,Menlo,monospace">
<circle cx="0" cy="-34" r="7" fill="#0E131D" stroke="#A4ED07" stroke-width="1"/><text y="-32">PLAN</text>
<circle cx="34" cy="0" r="7" fill="#0E131D" stroke="#A4ED07" stroke-width="1"/><text x="34" y="2">DO</text>
<circle cx="0" cy="34" r="7" fill="#0E131D" stroke="#A4ED07" stroke-width="1"/><text y="36">CHECK</text>
<circle cx="-34" cy="0" r="7" fill="#0E131D" stroke="#A4ED07" stroke-width="1"/><text x="-34" y="2">FIX</text></g>
<text y="4" text-anchor="middle" font-size="17" fill="#A4ED07" style="font-family:Georgia,serif">94</text>
<text y="12" text-anchor="middle" font-size="4.6" fill="#8E97A4" letter-spacing=".8" style="font-family:'Geist Mono',ui-monospace,Menlo,monospace">SCORE</text>
</g>
<g transform="translate(18 122)"><rect width="84" height="14" rx="7" fill="#0E131D" stroke="#26303D"/>
<circle cx="9" cy="7" r="3" fill="#A4ED07"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
<text x="16" y="9.2" font-size="5.2" fill="#C5CCD6" style="font-family:'Geist Mono',ui-monospace,Menlo,monospace">Checked · fixed · shipped</text></g>
<rect x="1" y="1" width="118" height="70" rx="11" fill="url(#sh)"/>
<text x="60" y="160" text-anchor="middle" class="lb">FEEDBACK LOOP</text>
<text x="60" y="170" text-anchor="middle" class="sb">AGENTS CHECK THEIR WORK</text>
</svg>